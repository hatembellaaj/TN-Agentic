# ============================================================
# TN-Agentic — Stack Docker Compose
# Sprint 1 : Agent météo bout en bout
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL : base de données métier
  # ----------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: tn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Africa/Tunis
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tn-net

  # ----------------------------------------------------------
  # scraper-weather : collecte OpenWeatherMap (24 gouvernorats)
  # ----------------------------------------------------------
  scraper-weather:
    build:
      context: ./scraper-weather
      dockerfile: Dockerfile
    container_name: tn-scraper-weather
    restart: unless-stopped
    env_file: .env
    environment:
      # DATABASE_URL construite automatiquement à partir des POSTGRES_* du .env
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tn-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------
  # scraper-bct : collecte BCT (devises + indicateurs macro)
  # ----------------------------------------------------------
  scraper-bct:
    build:
      context: ./scraper-bct
      dockerfile: Dockerfile
    container_name: tn-scraper-bct
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tn-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------
  # editorial-core : Claude + Publisher + Telegram + Dashboard
  # ----------------------------------------------------------
  editorial-core:
    build:
      context: ./editorial-core
      dockerfile: Dockerfile
    container_name: tn-editorial-core
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./output/articles:/var/www/articles
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tn-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------
  # n8n : orchestrateur de workflows
  # ----------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: tn-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      WEBHOOK_URL: ${PUBLIC_BASE_URL}/n8n/
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      N8N_EDITOR_BASE_URL: ${PUBLIC_BASE_URL}/n8n/
      N8N_PATH: /n8n/
      # Désactivé temporairement pour permettre l'accès via http://IP:18090/n8n/
      # À remettre à true (ou retirer) une fois HTTPS / Let's Encrypt en place.
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    networks:
      - tn-net

  # ----------------------------------------------------------
  # nginx : reverse proxy + serveur des articles statiques
  # ----------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: tn-nginx
    restart: unless-stopped
    ports:
      # Port hôte configurable via HOST_PORT dans .env (défaut 18090).
      # Tous les autres services restent INTERNES au réseau tn-net, donc aucun
      # conflit possible avec d'autres stacks Docker sur le serveur.
      - "${HOST_PORT:-18090}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./output/articles:/var/www/articles:ro
    depends_on:
      - editorial-core
      - scraper-weather
      - scraper-bct
      - n8n
    networks:
      - tn-net

  # ----------------------------------------------------------
  # adminer : UI debug PostgreSQL (derrière basic auth via nginx)
  # ----------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: tn-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - tn-net

volumes:
  postgres-data:
  n8n-data:

networks:
  tn-net:
    driver: bridge
