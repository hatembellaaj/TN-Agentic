server {
    listen 80;
    server_name _;

    # ----------------------------------------------------------
    # Articles statiques (FilePublisher)
    # ----------------------------------------------------------
    location /articles/ {
        alias /var/www/articles/;
        autoindex on;
        autoindex_format html;
        add_header X-Content-Type-Options nosniff;
    }

    # ----------------------------------------------------------
    # API + dashboard editorial-core
    # ----------------------------------------------------------
    location /api/ {
        proxy_pass http://editorial-core:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long timeouts pour permettre les opérations longues (backfill, etc.)
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_connect_timeout 60s;
    }

    location /dashboard/ {
        proxy_pass http://editorial-core:8000/dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------
    # Scrapers (weather / bct / energy) : NON exposés publiquement.
    # Ils restent joignables uniquement sur le réseau Docker interne tn-net
    # (editorial-core et n8n les appellent via http://scraper-xxx:800x).
    # Pour du debug ponctuel :
    #   docker compose exec editorial-core curl -s http://scraper-bct:8002/preview
    # ----------------------------------------------------------

    # ----------------------------------------------------------
    # n8n (orchestrateur, basic auth interne)
    # ----------------------------------------------------------
    location /n8n/ {
        proxy_pass http://n8n:5678/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # ----------------------------------------------------------
    # Adminer (DB debug, à protéger derrière basic auth en prod)
    # ----------------------------------------------------------
    location /adminer/ {
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ----------------------------------------------------------
    # Racine → redirige vers le dashboard
    # ----------------------------------------------------------
    location = / {
        return 302 /dashboard/;
    }
}
