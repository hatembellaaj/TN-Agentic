server {
    listen 80;
    server_name _;

    # ----------------------------------------------------------
    # Articles statiques (FilePublisher)
    # ----------------------------------------------------------
    location /articles/ {
        alias /var/www/articles/;
        autoindex on;
        autoindex_format html;
        add_header X-Content-Type-Options nosniff;
    }

    # ----------------------------------------------------------
    # API + dashboard editorial-core
    # ----------------------------------------------------------
    location /api/ {
        proxy_pass http://editorial-core:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long timeouts pour permettre les opérations longues (backfill, etc.)
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_connect_timeout 60s;
    }

    location /dashboard/ {
        proxy_pass http://editorial-core:8000/dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------
    # Scraper-weather (Swagger uniquement, accès admin)
    # ----------------------------------------------------------
    location /scraper/ {
        proxy_pass http://scraper-weather:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------
    # Scraper-bct (Swagger + endpoint /preview pour debug + backfill)
    # ----------------------------------------------------------
    location /scraper-bct/ {
        proxy_pass http://scraper-bct:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Le backfill peut prendre jusqu'à plusieurs heures
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_connect_timeout 60s;
    }

    # ----------------------------------------------------------
    # n8n (orchestrateur, basic auth interne)
    # ----------------------------------------------------------
    location /n8n/ {
        proxy_pass http://n8n:5678/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # ----------------------------------------------------------
    # Adminer (DB debug, à protéger derrière basic auth en prod)
    # ----------------------------------------------------------
    location /adminer/ {
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ----------------------------------------------------------
    # Racine → redirige vers le dashboard
    # ----------------------------------------------------------
    location = / {
        return 302 /dashboard/;
    }
}
